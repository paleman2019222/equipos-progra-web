<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contacto</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .content {
            flex: 1;
        }
        footer {
            position: relative;
            bottom: 0;
            width: 100%;
        }
    </style>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="#">Contact</a>
                <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

            </div>
        </nav>

        <div class="container mt-5 content">
            <h2 class="text-center mb-4">Contáctanos</h2>
            <div class="row">
                <div class="col-md-6 mx-auto">
                    <form>
                        <div class="mb-3">
                            <label for="nombre"
                                class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="nombre"
                                placeholder="Tu nombre">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo
                                Electrónico</label>
                            <input type="email" class="form-control" id="email"
                                placeholder="tuemail@example.com">
                        </div>
                        <div class="mb-3">
                            <label for="mensaje"
                                class="form-label">Mensaje</label>
                            <textarea class="form-control" id="mensaje" rows="4"
                                placeholder="Escribe tu mensaje aquí..."></textarea>
                        </div>
                        <button type="submit"
                            class="btn btn-primary w-100">Enviar</button>
                    </form>
                </div>
            </div>
        </div>

        <footer class="bg-dark text-light text-center py-3 mt-5">
            <p>&copy; 2025 Mi Sitio. Todos los derechos reservados.</p>
        </footer>

    </body>
</html>
